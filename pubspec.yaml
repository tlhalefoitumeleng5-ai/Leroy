name: leroy_ai
description: Leroy AI — production Android AI app by Leroy AI Solutions.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  cloud_functions: ^5.4.0
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5

  go_router: ^15.1.2

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2

  shared_preferences: ^2.5.3
  equatable: ^2.0.7
  dartz: ^0.10.1
  uuid: ^4.5.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  permission_handler: ^11.4.0
  gal: ^2.3.1
  http: ^1.3.0
  connectivity_plus: ^6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.4
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
